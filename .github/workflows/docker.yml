name: Build collector image

# Publishes the collector + dashboard as a Docker image to GitHub Container Registry:
#   ghcr.io/<owner>/sigen-dashboard:latest          (main branch and release tags)
#   ghcr.io/<owner>/sigen-dashboard:1.2.3 and :1.2  (release tags like v1.2.3, to pin a version)
# Built for amd64 (Intel/AMD NAS and PCs) and arm64 (ARM NAS, Raspberry Pi 4/5).
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["collector/**", "web/**", "Dockerfile", ".github/workflows/docker.yml"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sigen-dashboard
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
