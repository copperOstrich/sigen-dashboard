name: Build desktop widget apps

# Builds the Windows installer (.msi + .exe) and macOS app (.dmg, Intel + Apple Silicon)
# and publishes them as a GitHub release. The desktop app checks the latest release and
# offers to download and install anything newer.
#
# Versions: a tag like v1.2.0 builds that version; every other build (push to main or
# "Run workflow") is numbered 1.1.<run number>, so each new build is a new version.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/**", "web/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="1.1.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then exit 0; fi
          notes="$(git log -1 --pretty=%s)"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Home Energy $VERSION" --notes "$notes"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set version
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          node -e '
            const fs = require("fs"), p = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8")); c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));'
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" desktop/src-tauri/Cargo.toml

      - name: Install CLI
        working-directory: desktop
        run: npm install

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: v${{ needs.release.outputs.version }}
          releaseName: "Home Energy ${{ needs.release.outputs.version }}"
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: home-energy-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
