name: Build desktop widget apps

# Builds the Windows installer (.msi + .exe).
#
# The macOS build is paused until the app can be signed and notarised with an Apple
# developer certificate; unsigned Mac apps won't open on current macOS.
#
# - Push a tag like v1.2.0 to publish a release. The desktop app offers the latest
#   release as an update, so only tagged versions reach users.
# - Pushes to main (and "Run workflow") just build the installers and keep them as run
#   artifacts for testing; they don't publish a release.
#
# The version comes from the tag, or from desktop/src-tauri/tauri.conf.json otherwise.
# Release notes come from that version's section of CHANGELOG.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/**", "web/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then exit 0; fi
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?" v "\\]?([ ]|$)" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Home Energy $VERSION" > notes.md
          gh release create "v$VERSION" --verify-tag --title "Home Energy $VERSION" --notes-file notes.md --latest

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e '
            const fs = require("fs"), p = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8")); c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));'
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" desktop/src-tauri/Cargo.toml

      - name: Install CLI
        working-directory: desktop
        run: npm install

      - name: Build (and attach to the release for tags)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ needs.prepare.outputs.release == 'true' && format('v{0}', needs.prepare.outputs.version) || '' }}
          releaseName: "Home Energy ${{ needs.prepare.outputs.version }}"
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: home-energy-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
