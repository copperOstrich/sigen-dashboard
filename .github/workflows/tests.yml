name: Tests

# Unit tests and a smoke test (the collector on its built-in simulator, every page and API endpoint)
# on every push and pull request. The collector is standard library only; the MCP server's tests
# (tests/test_mcp.py) need the MCP SDK, installed here at the same version as its Docker image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # the same as the Docker image

      - name: Install the MCP SDK (for tests/test_mcp.py)
        run: pip install "mcp==2.3.*"

      - name: Unit tests
        env:
          REQUIRE_MCP: "1"          # fail rather than skip the MCP server's tests
          TZ: Australia/Sydney
        run: python -m unittest discover -s tests -v

      - name: Smoke test (simulator)
        env:
          TZ: Australia/Sydney
        run: python tests/smoke.py
