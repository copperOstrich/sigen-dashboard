name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. For setup questions, the [Q&A discussions](https://github.com/copperOstrich/sigen-dashboard/discussions/categories/q-a)
        are usually quicker.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of the dashboard, or at /api/health on the collector.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: inverter
    attributes:
      label: Inverter model and firmware
      placeholder: "SigenStor EC 12.0 SP, V100R001C22SPC112"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where is the collector running?
      options:
        - Docker (generic)
        - QNAP Container Station
        - Synology Container Manager
        - Unraid
        - Raspberry Pi
        - Python directly
        - Other
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part is affected?
      multiple: true
      options:
        - Collector / Modbus readings
        - Web dashboard
        - Installed as an app (Edge or Chrome)
        - Amber prices
        - LocalVolts prices
        - AEMO data
  - type: textarea
    id: debug
    attributes:
      label: Output of /api/debug
      description: Open http://<collector>:8080/api/debug (8088 on QNAP) and paste the result. Check it and remove anything you'd rather not share.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Collector log
      description: The last 20 or so lines of the container's log. API keys are never logged, but check before posting.
      render: text
