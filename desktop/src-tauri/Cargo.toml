[package]
name = "home-energy"
version = "1.7.5"
description = "SigenStor solar and battery dashboard with desktop widget"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
