# QNAP Container Station: Applications -> Create, paste this.
# Settings live in /share/Container/sigen-dashboard/sigen.env (copy sigen.env.example there
# with File Station and fill it in). To change a setting later, edit that file and restart
# the container; no need to recreate the application.
# The dashboard will be at http://<your-NAS-IP>:8088 (QTS itself uses port 8080).
services:
  sigen-dashboard:
    image: ghcr.io/copperostrich/sigen-dashboard:latest
    container_name: sigen-dashboard
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - /share/Container/sigen-dashboard:/data
    env_file:
      - /share/Container/sigen-dashboard/sigen.env
