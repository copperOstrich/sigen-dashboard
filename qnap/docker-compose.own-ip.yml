# QNAP Container Station, with the dashboard on its OWN IP address on your network,
# so it can use the normal web port and you can open http://<its IP> (or a name you give it in
# your router's DNS) with no ":8088" on the end.
#
# Before you paste this into Container Station -> Applications -> Create:
#   1. Pick a free address on your network for the dashboard, outside your router's DHCP
#      range so nothing else is ever given it (UniFi: Settings -> Networks -> your network
#      -> DHCP range). Put it in ipv4_address below.
#   2. Set subnet and gateway to match your network (most homes: 192.168.1.0/24 and the
#      router's address, often 192.168.1.1).
#   3. Set iface to the NAS's network adapter that's plugged into your network: usually
#      eth0 (check in Control Panel -> Network & Virtual Switch, or over SSH with ifconfig;
#      it may be eth1, bond0 or a br0 virtual switch).
#   4. Optional: give it a name in your router's local DNS, pointing at the ipv4_address.
#
# Settings still live in /share/Container/sigen-dashboard/sigen.env. If you already run the
# ordinary setup, remove that application first (your history in that folder is kept).
services:
  sigen-dashboard:
    image: ghcr.io/copperostrich/sigen-dashboard:latest
    container_name: sigen-dashboard
    restart: unless-stopped
    environment:
      - HTTP_PORT=80                  # the normal web port, on the container's own address
    volumes:
      - /share/Container/sigen-dashboard:/data
    networks:
      lan:
        ipv4_address: 192.168.1.50    # <- the dashboard's own address (step 1)

networks:
  lan:
    driver: qnet
    driver_opts:
      iface: eth0                     # <- step 3
    ipam:
      driver: qnet
      options:
        iface: eth0                   # <- same as above
      config:
        - subnet: 192.168.1.0/24      # <- step 2
          gateway: 192.168.1.1        # <- step 2
